name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dlauser
          POSTGRES_PASSWORD: dlapassword
          POSTGRES_DB: digital_life_auditor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dlauser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Unit and API tests
        run: pytest -q

      # The tests run on SQLite; this proves the migrations work on the real database.
      - name: Migrations apply on Postgres and match the models
        env:
          DATABASE_URL: postgresql://dlauser:dlapassword@localhost:5432/digital_life_auditor
          PLAID_CLIENT_ID: ci
          PLAID_SECRET: ci
          JWT_SECRET: ci
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  mobile:
    name: Mobile typecheck and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Bundle for web and Android
        env:
          CI: "1"
        run: |
          npx expo export --platform web --output-dir /tmp/web
          npx expo export --platform android --output-dir /tmp/android

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create env files from the examples
        run: cp backend/.env.example backend/.env && cp .env.example .env
      - run: docker compose config -q
      - name: Start postgres + backend (runs migrations)
        run: docker compose up -d --build --wait --wait-timeout 180 postgres backend
      - name: Register, log in and call an authenticated endpoint
        run: |
          curl -fsS localhost:8000/health
          curl -fsS -X POST localhost:8000/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1"}' > /dev/null
          TOKEN=$(curl -fsS -X POST localhost:8000/auth/login -d 'username=ci@example.com&password=ci-password-1' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS localhost:8000/subscriptions -H "Authorization: Bearer $TOKEN"
      - name: Seed demo data and check detection
        run: |
          docker compose exec -T backend python -m app.seed_demo
      - if: failure()
        run: docker compose logs --no-color
